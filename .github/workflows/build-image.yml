name: Build Firefox image

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Test startup scripts
        env:
          FIREFOX_TEST_TMPDIR: ${{ runner.temp }}/firefox-tests
        run: node --test tests/*.test.mjs
      - name: Validate Compose
        run: docker compose config --quiet

  build:
    needs: test
    runs-on: ubuntu-22.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Prepare image tags
        id: prep
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        shell: bash
        run: |
          IMAGE="ghcr.io/${GITHUB_REPOSITORY,,}"
          TAGS="${IMAGE}:sha-${GITHUB_SHA:0:12}"
          PUBLISH=false
          if [[ "$GITHUB_EVENT_NAME" != "pull_request" ]]; then
            if [[ "$GITHUB_REF" == "refs/heads/$DEFAULT_BRANCH" ]]; then
              TAGS="${TAGS},${IMAGE}:latest"
              PUBLISH=true
            elif [[ "$GITHUB_REF" == refs/tags/v* ]]; then
              VERSION="${GITHUB_REF#refs/tags/v}"
              if [[ ! "$VERSION" =~ ^[A-Za-z0-9_][A-Za-z0-9_.-]{0,127}$ ]]; then
                echo "::error::Invalid Docker version tag."
                exit 1
              fi
              TAGS="${TAGS},${IMAGE}:${VERSION}"
              PUBLISH=true
            fi
          fi
          echo "tags=$TAGS" >> "$GITHUB_OUTPUT"
          echo "publish=$PUBLISH" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4
        with:
          platforms: arm,arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build native smoke-test image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.hanging
          platforms: linux/amd64
          load: true
          push: false
          tags: firefox-smoke:ci
          cache-from: type=gha

      - name: Check the running container
        shell: bash
        run: |
          docker run -d --name firefox-smoke \
            --shm-size=256m \
            --memory=1g --cpus=1.5 --pids-limit=512 \
            -p 127.0.0.1::5800 \
            -e KEEP_APP_RUNNING=1 \
            -e FF_OPEN_URL=about:blank \
            -e DISPLAY_WIDTH=1280 \
            -e DISPLAY_HEIGHT=720 \
            firefox-smoke:ci
          ADDRESS="$(docker port firefox-smoke 5800/tcp)"
          READY=false
          for attempt in {1..60}; do
            if curl --silent --fail --max-time 2 "http://${ADDRESS}/" >/dev/null &&
               docker exec firefox-smoke /usr/share/firefox-tools/healthcheck.sh >/dev/null 2>&1; then
              READY=true
              break
            fi
            sleep 2
          done
          if [[ "$READY" != true ]]; then
            echo "::error::Firefox or its web interface did not start."
            exit 1
          fi
          docker exec firefox-smoke sh -c \
            'test -L /etc/machine-id && test -x /etc/services.d/firefox-logrotate/run && test -f /config/profile/prefs.js && grep -q "installFirefoxInput(UI)" /opt/noVNC/index.html && test -f /opt/noVNC/app/firefox-input.js'
          docker exec --user 1000:1000 firefox-smoke /etc/services.d/firefox-logrotate/run
          docker stats --no-stream \
            --format 'CPU={{.CPUPerc}} MEM={{.MemUsage}} PIDS={{.PIDs}}' firefox-smoke
          docker stop --timeout 30 firefox-smoke
          if [[ "$(docker inspect --format '{{.State.OOMKilled}}' firefox-smoke)" != false ]]; then
            echo "::error::Firefox was killed by the memory limit."
            exit 1
          fi

      - name: Clean up smoke-test container
        if: always()
        run: |
          docker logs firefox-smoke 2>&1 || true
          docker exec firefox-smoke sh -c 'tail -n 80 /config/log/firefox/error.log' || true
          docker rm -f firefox-smoke 2>/dev/null || true

      - name: Log in to GHCR
        if: steps.prep.outputs.publish == 'true'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.hanging
          platforms: linux/amd64,linux/386,linux/arm/v7,linux/arm64/v8
          push: ${{ steps.prep.outputs.publish == 'true' }}
          tags: ${{ steps.prep.outputs.tags }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: ${{ steps.prep.outputs.publish == 'true' && 'type=gha,mode=max' || '' }}
